<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" fill="none">
  <defs>
    <!-- Facet 1 (Leftmost) Gradient -->
    <linearGradient id="full-p1-grad" x1="10" y1="22" x2="26" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B65FF"/>
      <stop offset="100%" stop-color="#1B36C7"/>
    </linearGradient>

    <!-- Facet 2 (Center-Left) Gradient -->
    <linearGradient id="full-p2-grad" x1="26" y1="12" x2="40" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#244AE8"/>
      <stop offset="100%" stop-color="#0E239E"/>
    </linearGradient>

    <!-- Facet 3 (Center-Right) Gradient -->
    <linearGradient id="full-p3-grad" x1="40" y1="22" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>

    <!-- Facet 4 (Rightmost) Gradient -->
    <linearGradient id="full-p4-grad" x1="54" y1="12" x2="68" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#1D4CE8"/>
    </linearGradient>

    <!-- Chevron Band Gradient -->
    <linearGradient id="full-chevron-grad" x1="10" y1="38" x2="68" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <!-- Group for Folded Map Icon (scaled/positioned on left) -->
  <g transform="translate(4, 5)">
    <!-- Top Middle Node -->
    <line x1="43" y1="23" x2="43" y2="6" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="43" cy="6" r="2.5" stroke="#00F0FF" stroke-width="1.8" fill="white"/>

    <!-- Bottom Left Node -->
    <line x1="20" y1="56" x2="20" y2="67" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="67" r="2.5" stroke="#00F0FF" stroke-width="1.8" fill="white"/>

    <!-- Panel 1 -->
    <polygon points="8,23 24,13 24,51 8,61" fill="url(#full-p1-grad)"/>

    <!-- Panel 2 -->
    <polygon points="24,13 39,23 39,61 24,51" fill="url(#full-p2-grad)"/>

    <!-- Panel 3 -->
    <polygon points="39,23 54,13 54,51 39,61" fill="url(#full-p3-grad)"/>

    <!-- Panel 4 -->
    <polygon points="54,13 69,23 69,61 54,51" fill="url(#full-p4-grad)"/>

    <!-- Central Dynamic Chevron Ribbon -->
    <path d="M8,47 L24,37 L39,47 L54,37 L69,47 L69,39 L54,29 L39,39 L24,29 L8,39 Z" fill="url(#full-chevron-grad)" opacity="0.95"/>

    <!-- Code Brackets & Circuits -->
    <path d="M17,28 L14,31 L17,34" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M20,28 L23,31 L20,34" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <circle cx="18" cy="45" r="1.5" fill="#00F0FF"/>
    <path d="M18,45 L13,50 L19,56" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <path d="M43,23 L43,33 L32,40" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="47" cy="29" r="1.1" fill="#00F0FF"/>
    <circle cx="49" cy="32" r="1.1" fill="#00F0FF"/>
    <circle cx="51" cy="35" r="1.1" fill="#00F0FF"/>

    <path d="M60,46 L57,49 L60,52" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M63,46 L66,49 L63,52" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark Text: "CodeAtlas" -->
  <text x="88" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#0B1A75" class="codeatlas-brand-code">Code</tspan><tspan fill="#00E5FF">Atlas</tspan>
  </text>
</svg>
