<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Facet 1 (Leftmost) Gradient -->
    <linearGradient id="p1-grad" x1="10" y1="32" x2="32" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B65FF"/>
      <stop offset="100%" stop-color="#1B36C7"/>
    </linearGradient>

    <!-- Facet 2 (Center-Left) Gradient -->
    <linearGradient id="p2-grad" x1="32" y1="18" x2="52" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#244AE8"/>
      <stop offset="100%" stop-color="#0E239E"/>
    </linearGradient>

    <!-- Facet 3 (Center-Right) Gradient -->
    <linearGradient id="p3-grad" x1="52" y1="32" x2="72" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>

    <!-- Facet 4 (Rightmost) Gradient -->
    <linearGradient id="p4-grad" x1="72" y1="18" x2="92" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#1D4CE8"/>
    </linearGradient>

    <!-- Chevron Band Gradient -->
    <linearGradient id="chevron-grad" x1="10" y1="55" x2="92" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- External Circuit Nodes & Traces (extending outside the map) -->
  <!-- Top Middle Node -->
  <line x1="56" y1="31" x2="56" y2="10" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="56" cy="10" r="3.2" stroke="#00F0FF" stroke-width="2.2" fill="white"/>

  <!-- Bottom Left Node -->
  <line x1="26" y1="78" x2="26" y2="92" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="26" cy="92" r="3.2" stroke="#00F0FF" stroke-width="2.2" fill="white"/>

  <!-- Panel 1: Leftmost Fold -->
  <polygon points="10,33 32,19 32,71 10,85" fill="url(#p1-grad)"/>

  <!-- Panel 2: Center-Left Fold -->
  <polygon points="32,19 52,33 52,85 32,71" fill="url(#p2-grad)"/>

  <!-- Panel 3: Center-Right Fold -->
  <polygon points="52,33 72,19 72,71 52,85" fill="url(#p3-grad)"/>

  <!-- Panel 4: Rightmost Fold -->
  <polygon points="72,19 92,33 92,85 72,71" fill="url(#p4-grad)"/>

  <!-- Central Dynamic Chevron Ribbon (The glowing path across the map) -->
  <path d="M10,65 L32,51 L52,65 L72,51 L92,65 L92,54 L72,40 L52,54 L32,40 L10,54 Z" fill="url(#chevron-grad)" opacity="0.95"/>

  <!-- Internal Circuit Lines & Code Elements -->
  <!-- Left Code Bracket < > on Panel 1 -->
  <path d="M22,39 L18,43 L22,47" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M26,39 L30,43 L26,47" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Circuit Trace on Panel 1 -->
  <circle cx="24" cy="62" r="2" fill="#00F0FF"/>
  <path d="M24,62 L18,68 L26,76" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Circuit Trace & 3 Vias on Panel 2/3 -->
  <path d="M56,31 L56,45 L42,54" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="61" cy="40" r="1.4" fill="#00F0FF"/>
  <circle cx="64" cy="44" r="1.4" fill="#00F0FF"/>
  <circle cx="67" cy="48" r="1.4" fill="#00F0FF"/>

  <!-- Right Code Bracket < > on Panel 4 -->
  <path d="M80,63 L76,67 L80,71" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M84,63 L88,67 L84,71" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Node on Panel 3/4 -->
  <circle cx="83" cy="45" r="2.2" stroke="#00F0FF" stroke-width="1.6" fill="white"/>
  <path d="M83,45 L72,52" stroke="#00F0FF" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
