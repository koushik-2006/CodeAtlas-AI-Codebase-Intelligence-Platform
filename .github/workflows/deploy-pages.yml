name: Deploy CodeAtlas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      api_url:
        description: "Custom Backend API URL for Member 2 Services (e.g. https://api.codeatlas.example.com/api)"
        required: false
        default: ""

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Frontend Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout CodeAtlas Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Static Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build Static Export for GitHub Pages
        working-directory: frontend
        run: npm run build:pages
        env:
          NEXT_PUBLIC_APP_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || 'CodeAtlas-AI-Codebase-Intelligence-Platform' }}"
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || vars.NEXT_PUBLIC_API_URL || '/api' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_url || vars.NEXT_PUBLIC_API_BASE_URL || '/api' }}
          NEXT_PUBLIC_DEMO_MODE: ${{ (inputs.api_url || vars.NEXT_PUBLIC_API_URL) && 'false' || 'true' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PAGES: "true"
          STATIC_EXPORT: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify Static Export Output Directory
        run: |
          if [ ! -d "frontend/out" ]; then
            echo "::error::Static export directory 'frontend/out' does not exist!"
            exit 1
          fi
          if [ ! -f "frontend/out/index.html" ]; then
            echo "::error::Index HTML file 'frontend/out/index.html' is missing!"
            exit 1
          fi
          if [ ! -f "frontend/out/.nojekyll" ]; then
            echo "::error::GitHub Pages asset directive 'frontend/out/.nojekyll' is missing!"
            exit 1
          fi
          echo "Static export verified with $(ls -1 frontend/out | wc -l) top-level entries."

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
